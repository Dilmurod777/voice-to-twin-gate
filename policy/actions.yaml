# Every command the twin can perform. `sets` is the only thing an admit changes.
# Read-only actions are admitted at any step and must never carry `sets`.
- verb: open_panel
  part: access_panel
  label: remove the access panel
  mutates: true
  sets: access_panel_open
  requires: []
  procedure_steps: [1]
  admit: "panel 12A opened, step 1 of the procedure"
  blocked: {}

- verb: depressurise
  part: fuel_system
  label: depressurise the fuel system
  mutates: true
  sets: fuel_depressurised
  requires: [access_panel_open]
  procedure_steps: [2]
  admit: "fuel system depressurised"
  blocked:
    access_panel_open: "access panel 12A is still closed"

- verb: open_valve
  part: fuel_valve
  label: open the fuel valve
  mutates: true
  sets: fuel_valve_open
  requires: [fuel_depressurised]
  procedure_steps: [3]
  admit: "fuel valve open"
  blocked:
    fuel_depressurised: "fuel system is not depressurised"

- verb: remove_filter
  part: fuel_filter
  label: remove the fuel filter
  mutates: true
  sets: fuel_filter_removed
  requires: [fuel_depressurised]
  procedure_steps: [4]
  admit: "fuel filter removed"
  blocked:
    fuel_depressurised: "fuel system is not depressurised"

- verb: fit_filter
  part: fuel_filter
  label: fit a new fuel filter
  mutates: true
  sets: fuel_filter_fitted
  requires: [fuel_filter_removed]
  procedure_steps: [5]
  admit: "new filter fitted, housing leak-checked"
  blocked:
    fuel_filter_removed: "no filter has been removed yet"

- verb: remove_pump
  part: hydraulic_pump
  label: remove the hydraulic pump
  mutates: true
  sets: hydraulic_pump_removed
  requires: []
  procedure_steps: [6]
  admit: "hydraulic pump removed"
  blocked: {}

- verb: inspect
  part: landing_gear
  label: show the landing gear
  mutates: false
  admit: "read-only view"

- verb: inspect
  part: engine_cowl
  label: show the engine cowl
  mutates: false
  admit: "read-only view"
